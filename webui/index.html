<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopilotBridge Agent</title><script>try{let t=localStorage.getItem("cbp-theme");if(t&&t!=="dark")document.documentElement.dataset.theme=t;if(localStorage.getItem("cbp-rail")==="closed")document.documentElement.dataset.rail="closed"}catch(e){}</script><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
  <aside class="rail">
    <button id="railBtn" title="收起/展开侧栏" onclick="toggleRail()">‹</button>
    <div class="railtop"><button class="btn accent block" onclick="openTask()">＋ 新任务</button></div>
    <div class="listhead"><span>SESSIONS</span><input id="sessFilter" placeholder="筛选…" oninput="drawSessions()"><button class="iconbtn" title="使用手册" onclick="openManual()">📖</button><button id="browserBtn" class="iconbtn" title="切换自动化浏览器窗口的显示/隐藏" onclick="toggleBrowser()">▣</button><button id="themeBtn" class="iconbtn" title="主题：深色（点击切换）" onclick="toggleTheme()">◐</button></div>
    <div id="sessions" class="sesslist"></div>
  </aside>
  <main class="main">
    <div id="emptyState" class="empty">
      <div class="big">CB</div>
      <div>从左侧选择一个 Session，或发起新任务</div>
      <div style="font-size:12px">提示：时间线中的 <kbd>查看结果</kbd> 可展开结构化 JSON</div>
    </div>
    <div id="sessionView" style="display:none">
      <header class="topbar">
        <div class="trow"><h1 id="title">—</h1><span id="statepill" class="pill">—</span></div>
        <div id="status" class="sub">—</div>
        <div class="actions">
          <div class="grp">
            <button class="btn" onclick="control('pause')">暂停</button>
            <button class="btn" onclick="control('resume')">恢复</button>
            <button class="btn" onclick="control('compact')">压缩上下文</button>
          </div>
          <div class="grp">
            <button class="btn" onclick="continueAgent()">继续执行</button>
            <button class="btn" onclick="activate()">切换到页面</button>
            <button class="btn" onclick="openCopilot()">打开会话 ↗</button>
          </div>
          <div class="grp">
            <button class="btn danger" onclick="control('cancel')">取消任务</button>
            <div class="menu"><button class="btn ghost" id="moreBtn" onclick="toggleMore(event)">更多 ▾</button><div class="menuList" id="moreMenu">
              <button onclick="control('archive')">归档</button>
              <button onclick="rollbackSession()">回滚任务改动…</button>
              <button class="danger" onclick="rollbackSelfUpgrade()">回滚服务自升级…</button>
              <button onclick="removeSession(false)">仅删除本地记录</button>
              <button class="danger" onclick="removeSession(true)">同时删除 Copilot 会话</button>
            </div></div>
          </div>
        </div>
      </header>
      <section class="kpis">
        <div class="kpi"><span>状态</span><b id="kpiState">—</b></div>
        <div class="kpi"><span>总步骤</span><b id="kpiSteps">0</b></div>
        <div class="kpi"><span>当前会话步骤</span><b id="kpiConv">0</b></div>
        <div class="kpi"><span>会话切换</span><b id="kpiRoll">0</b></div>
        <div class="kpi"><span>TOKEN 估算</span><b id="kpiToken">0</b><small id="kpiBudget" style="color:var(--faint);font-size:12px"> / —</small><div class="meter"><span id="tokenbar"></span></div></div>
      </section>
      <section class="card">
        <div class="chead"><span id="pulse" class="dot-off"></span>
          <div class="tabs">
            <button class="tab on" id="tabActivity" onclick="liveTab('activity')">当前执行状态</button>
            <button class="tab" id="tabAnswer" onclick="liveTab('answer')">Copilot 当前回答</button>
            <button class="tab" id="tabPrompt" onclick="liveTab('prompt')">最近发送内容</button>
            <button class="tab" id="tabChat" onclick="liveTab('chat')">继续对话</button>
          </div>
          <span class="hint"><button class="btn ghost" style="padding:2px 10px;font-size:12px" title="放大查看当前面板" onclick="expandLive()">⤢ 放大</button></span>
        </div>
        <pre id="activity" class="term livepane">—</pre>
        <pre id="answer" class="term livepane" style="display:none">等待回答…</pre>
        <pre id="prompt" class="term livepane" style="display:none">—</pre>
        <div id="chat" class="livepane chatwrap" style="display:none">
          <div class="chatbar"><span class="meta">继续当前 Session 对话</span><span style="display:flex;gap:6px"><button id="modeAgent" class="btn seg on" onclick="setFollowupMode('agent')">Agent 继续执行</button><button id="modeChat" class="btn seg" onclick="setFollowupMode('chat')">普通对话</button></span></div>
          <div id="chatlog" class="chatlog"><div class="meta">选择 Session 后，可以在这里继续对话。</div></div>
          <div class="composer">
            <textarea id="followup" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="sendFollowup" class="btn accent" onclick="sendFollowup()">发送</button>
          </div>
        </div>
      </section>
      <div class="content">
        <section class="card"><div class="chead">步骤时间线<span class="hint"><span id="stepCount" style="margin-right:8px"></span><button class="btn ghost" style="padding:2px 10px;font-size:12px" title="导出完整时间线 JSON（含每步参数、结果与错误现场），便于调试" onclick="exportTimeline()">⬇ 导出</button></span></div><div id="steps" class="steps"></div></section>
      </div>
    </div>
  </main>
</div>
<div class="mask" id="dlgMask" onclick="if(event.target===this)closeDlg()">
  <div class="dlg" role="dialog" aria-modal="true">
    <div class="dhead"><span id="dlgTitle">删除结果</span><span class="hint" id="dlgHint"></span></div>
    <div class="dbody"><div class="dmsg" id="dlgMsg"></div><div id="dlgList" style="display:flex;flex-direction:column;gap:10px"></div></div>
    <div class="dfoot">
      <button class="btn ghost" id="dlgCopy">复制结果 JSON</button>
      <button class="btn danger" id="dlgForce">重试远程并强制清理本地记录</button>
      <button class="btn accent" onclick="closeDlg()">关闭</button>
    </div>
  </div>
</div>
<div id="demoBadge" class="demo" style="display:none">演示模式 · API 未连接</div>
<!-- 使用手册 -->
<div class="mask" id="manualMask" onclick="if(event.target===this)closeManual()">
  <div class="dlg" style="width:min(760px,94vw)">
    <div class="dhead"><span>📖 使用手册</span><span class="hint">Esc 关闭</span></div>
    <div class="dbody manual" id="manualBody"></div>
    <div class="dfoot"><button class="btn accent" onclick="closeManual()">关闭</button></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<!-- 通用模态层：通知确认 / 危险确认 / 文本输入 -->
<div class="mask" id="gmMask" onclick="if(event.target===this)gmClose(null)">
  <div class="dlg" style="width:min(480px,94vw)">
    <div class="dhead"><span id="gmTitle">提示</span></div>
    <div class="dbody"><div class="dmsg" id="gmMsg"></div><input id="gmInput" style="display:none"></div>
    <div class="dfoot">
      <button class="btn ghost" id="gmCancel">取消</button>
      <button class="btn accent" id="gmOk">确定</button>
    </div>
  </div>
</div>
<!-- 实时面板放大查看弹窗 -->
<div class="mask" id="liveMask" onclick="if(event.target===this)closeLive()">
  <div class="dlg" style="width:min(1100px,94vw)">
    <div class="dhead"><span id="liveTitle">查看</span><span class="hint">Esc 关闭</span></div>
    <div class="dbody"><pre id="liveBody" class="term" style="max-height:72vh;border-radius:9px;font-size:13px;line-height:1.75"></pre></div>
    <div class="dfoot">
      <button class="btn ghost" id="liveCopy">复制内容</button>
      <button class="btn accent" onclick="closeLive()">关闭</button>
    </div>
  </div>
</div>
<!-- 新任务弹窗：表单字段与元素 ID 保持与旧内嵌版一致，JS 无需改动 -->
<div class="mask" id="taskMask" onclick="if(event.target===this)closeTask()">
  <div class="dlg" style="width:min(560px,94vw)">
    <div class="dhead"><span>发起新任务</span><span class="hint">Esc 关闭</span></div>
    <div class="dbody">
      <input id="sid" placeholder="Session ID（可留空）">
      <input id="workspace" placeholder="工作目录（可留空）">
      <div style="display:flex;gap:6px"><select id="model"><option value="copilot-auto">Auto</option><option value="copilot-think-deeper">Think deeper</option></select><button class="btn" style="flex:none;padding:5px 10px" title="重新读取 Copilot 模型菜单" onclick="refreshModels()">↻</button></div>
      <textarea id="task" rows="6" placeholder="任务内容，例如：分析 workspace 里的项目并生成 TODO"></textarea>
      <div style="display:flex;gap:6px"><button id="ntAgent" class="btn seg on" style="flex:1" onclick="setTaskMode('agent')">Agent 执行</button><button id="ntChat" class="btn seg" style="flex:1" onclick="setTaskMode('chat')">普通对话</button></div>
    </div>
    <div class="dfoot">
      <button class="btn ghost" onclick="closeTask()">取消</button>
      <button class="btn accent" onclick="runTask()">启动任务</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
