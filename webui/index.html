<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopilotBridge Agent</title><script>try{let t=localStorage.getItem("cbp-theme");if(t&&t!=="dark")document.documentElement.dataset.theme=t;if(localStorage.getItem("cbp-rail")==="closed")document.documentElement.dataset.rail="closed"}catch(e){}</script><style>
:root{
  --bg:#0b0f14;--panel:#11161d;--panel2:#151c26;--line:#212b38;--line2:#2b3847;
  --text:#e6edf3;--muted:#8b98a9;--faint:#5c6a7a;
  --accent:#4f8ef7;--accent2:#79b0ff;
  --green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;
  /* 组件级变量：新增主题只需改这里 */
  --scrollbar:#2b3847;--input-bg:#0d1319;--btn-bg:#1a2230;--btn-hover-text:#fff;
  --sess-hover:#182030;--sess-sel:#1a2433;--dot-off:#3a4656;
  --menu-shadow:rgba(0,0,0,.6);--menu-hover:#232e3f;--meter:#0d1319;
  --term-bg:#0a0e13;--term-text:#c9d4e0;--step-line:#1a2230;
  --jv-bg:#0a0e13;--jv-text:#dbe4f0;--jv-border:#1d2836;--jv-ind:#2b3847;
  --ky:#c4b5fd;--st:#86efac;--nm:#93c5fd;--bl:#fbbf24;--nl:#64748b;
  --msg-user-bg:#1d3a6e;--msg-user-border:#2b4f8f;--big:#2b3847;
  --danger-bg:#241516;--danger-border:#5a2b28;--danger-text:#ff8a80;--danger-hover-text:#ffb3ad;
  --mask-bg:rgba(3,7,12,.66);--dlg-shadow:rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:318px 1fr;height:100vh;overflow:hidden}

/* ── 左侧栏 ─────────────────────────────── */
.rail{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0;position:relative}
/* 折叠拉手：贴在侧栏右缘的细长竖条；折叠后侧栏归零只剩它 */
#railBtn{position:absolute;right:-16px;top:50%;transform:translateY(-50%);z-index:30;width:16px;height:64px;padding:0;border:1px solid var(--line2);border-left:0;border-radius:0 8px 8px 0;background:var(--panel);color:var(--faint);font-size:13px;line-height:1;cursor:pointer}
#railBtn:hover{color:var(--accent2);border-color:var(--accent)}
.iconbtn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.newtask{margin:12px 12px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.newtask>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;color:var(--accent2);user-select:none}
.newtask>summary::-webkit-details-marker{display:none}
.newtask>summary::before{content:"＋ ";color:var(--accent)}
.newtask[open]>summary{border-bottom:1px solid var(--line);color:var(--text)}
.newtask[open]>summary::before{content:"－ ";color:var(--muted)}
.ntbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.listhead{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;font-size:11px;letter-spacing:1.5px;color:var(--faint)}
.listhead input{flex:1;padding:5px 9px;font-size:12px;letter-spacing:0}
.sesslist{flex:1;overflow:auto;padding:0 8px 12px}
.sess{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.sess:hover{background:var(--sess-hover)}
.sess.sel{background:var(--sess-sel);border-color:var(--line2)}
.sess .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#5c6a7a}
.dot.run{background:var(--green);box-shadow:0 0 0 3px #3fb95022;animation:pulse 1.4s infinite}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px #d2992222}
.dot.bad{background:var(--red);box-shadow:0 0 0 3px #f8514922}
.dot.done{background:var(--blue)}
@keyframes pulse{50%{opacity:.35}}
.smeta{flex:1;min-width:0}
.smeta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.stag{flex:none;font-size:10.5px;color:var(--muted);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.sess-empty{color:var(--faint);text-align:center;padding:26px 10px;font-size:12.5px}

input,textarea,select{background:var(--input-bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f8ef722}
textarea{resize:vertical}

.btn{border:1px solid var(--line2);background:var(--btn-bg);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--btn-hover-text)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.accent:hover{background:var(--accent2)}
.btn.danger{border-color:var(--danger-border);color:var(--danger-text);background:var(--danger-bg)}
.btn.danger:hover{border-color:var(--red);color:var(--danger-hover-text)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* ── 主区域 ─────────────────────────────── */
.main{overflow:auto;min-width:0;padding:18px 22px 26px;display:flex;flex-direction:column}
#sessionView{flex:1;display:flex;flex-direction:column;min-height:0}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint)}
.empty .big{font-size:44px;font-weight:700;letter-spacing:2px;color:var(--big)}
.empty kbd{border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-size:12px;background:var(--panel2)}

.topbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.trow{display:flex;align-items:center;gap:12px;min-width:0}
.trow h1{margin:0;font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:12px;border-radius:20px;padding:3px 11px;border:1px solid var(--line2);color:var(--muted)}
.pill.run{color:#7ee787;border-color:#2ea04366;background:#3fb95014}
.pill.warn{color:#e8b339;border-color:#9e6a0366;background:#d2992214}
.pill.bad{color:#ffa198;border-color:#f8514966;background:#f8514914}
.pill.done{color:#79b0ff;border-color:#58a6ff66;background:#58a6ff14}
.sub{color:var(--muted);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.grp{display:flex;gap:7px;padding-right:14px;border-right:1px solid var(--line);align-items:center}
.grp:last-child{border-right:0;padding-right:0}
.actions .btn{height:34px;padding-top:0;padding-bottom:0}
.menu{position:relative;display:flex;align-items:center}
.menuList{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:210px;box-shadow:0 14px 40px var(--menu-shadow);z-index:20}
.menuList.open{display:flex}
.menuList button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.menuList button:hover{background:var(--menu-hover)}
.menuList button.danger{color:#ff8a80}

/* KPI 条：auto-fit 让卡片数随可用宽度自适应，杜绝窄窗口网格溢出互相挤压 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpis .kpi:last-child{grid-column:span 2}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.kpi span{display:block;font-size:11px;letter-spacing:1px;color:var(--faint);margin-bottom:5px}
.kpi b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.meter{height:7px;background:var(--meter);border-radius:5px;overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .5s}

/* 内容双栏：占据窗口剩余高度，卡片内部面板 flex 自适应 */
.content{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:stretch;flex:1;min-height:280px}
.content>.card{display:flex;flex-direction:column;min-height:0}
.livecol{display:flex;flex-direction:column;gap:12px;min-height:0}
.livecol .card{flex:1;display:flex;flex-direction:column;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.chead{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.chead .hint{margin-left:auto;font-weight:400;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.livecol{display:flex;flex-direction:column;gap:12px}
.term{margin:0;padding:12px 15px;background:var(--term-bg);border-radius:0 0 11px 11px;color:var(--term-text);font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:64px;max-height:40vh;overflow:auto}
.term.short{max-height:25vh}

/* 实时面板选项卡（执行状态/当前回答/发送内容共用整列空间） */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line2);background:transparent;border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab.new::after{content:'●';color:var(--green);font-size:9px;margin-left:5px;vertical-align:2px}
.livepane{flex:1;min-height:0;max-height:none;font-size:13px;line-height:1.75}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.3s infinite}
.dot-off{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dot-off)}

/* 时间线（与右侧实时面板共用剩余高度，随窗口伸缩） */
.steps{flex:1;min-height:0;overflow:auto}
.step{padding:10px 15px;border-bottom:1px solid var(--step-line);border-left:3px solid transparent}
.step:last-child{border-bottom:0}
.step.ok{border-left-color:var(--green)}
.step.error{border-left-color:var(--red)}
.step.info{border-left-color:var(--blue)}
.step .head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.step .head b{font-size:13px}
.schip{font-size:10.5px;border-radius:20px;padding:1px 8px;border:1px solid var(--line2);color:var(--muted)}
.step.error .schip{color:#ffa198;border-color:#f8514955}
.step.ok .schip{color:#7ee787;border-color:#2ea04355}
.step .why{color:var(--muted);font-size:12.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
details{margin-top:7px}
details>summary{cursor:pointer;color:var(--accent2);font-size:12.5px;user-select:none}

/* JSON 树 */
.jsonview{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;line-height:1.65;background:var(--jv-bg);color:var(--jv-text);border:1px solid var(--jv-border);border-radius:9px;padding:10px 13px;overflow:auto;max-height:460px;white-space:normal}
.jsonview .ind{padding-left:20px;border-left:1px dotted var(--jv-ind)}
.jsonview .ky{color:var(--ky);font-weight:600}
.jsonview .st{color:var(--st);white-space:pre-wrap;word-break:break-word}
.jsonview .nm{color:var(--nm)}.jsonview .bl{color:var(--bl)}.jsonview .nl{color:var(--nl)}

/* 对话区 */
.chat{margin:0 0 12px}
.chatlog{min-height:140px;max-height:45vh;overflow:auto;padding:14px 15px;display:flex;flex-direction:column}
.chatlog .meta{color:var(--faint);font-size:12.5px}
.msg{max-width:78%;margin:5px 0;padding:9px 13px;border-radius:13px;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--msg-user-bg);border:1px solid var(--msg-user-border)}
.msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2)}
.msg b{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.composer{display:flex;gap:9px;padding:12px 15px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:160px}
.composer .btn{flex:none;height:44px;padding:0 22px}
.btn.seg{padding:3px 12px;font-size:12px;height:28px;border-radius:20px}
.btn.seg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.demo{position:fixed;top:16px;right:18px;z-index:99;background:#3d2b10;border:1px solid #9e6a03;color:#e8b339;font-size:12px;padding:6px 13px;border-radius:20px}

/* ── 删除结果弹窗 ── */
.mask{position:fixed;inset:0;background:var(--mask-bg);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
.mask.open{display:flex}
.dlg{width:min(640px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 70px var(--dlg-shadow);overflow:hidden;animation:dlgIn .16s ease-out}
@keyframes dlgIn{from{transform:translateY(8px);opacity:0}}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
.dhead .hint{margin-left:auto;font-weight:400;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.dbody{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dmsg{font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;line-height:1.65}
.dres{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.dres .rhead{display:flex;align-items:center;gap:9px;min-width:0}
.ric{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.dres.ok .ric{background:#3fb95022;color:#7ee787;border:1px solid #2ea04366}
.dres.fail .ric{background:#f8514922;color:#ffa198;border:1px solid #f8514966}
.dres .ttl{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dres .mth{margin-left:auto;flex:none;font-size:10.5px;color:var(--faint);border:1px solid var(--line2);border-radius:20px;padding:1px 8px;white-space:nowrap}
.dres .url{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:copy}
.dres .url:hover{color:var(--accent2);text-decoration:underline}
.dres .err{font-size:12.5px;color:#ffa198;background:#f8514912;border:1px solid #f8514933;border-radius:8px;padding:7px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.dfoot{display:flex;gap:9px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ── 页面内通知与通用弹层（替代浏览器原生 alert/confirm/prompt） ── */
.toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 18px;font-size:13px;box-shadow:0 10px 32px var(--dlg-shadow);animation:dlgIn .16s ease-out;max-width:min(560px,90vw);white-space:pre-wrap;word-break:break-word;pointer-events:auto}
.toast.err{border-color:var(--red);color:var(--danger-text)}
.toast.ok{border-color:var(--green);color:var(--green)}
#gmInput{margin-top:4px}

/* 使用手册 */
.manual{line-height:1.8}
.manual h3{margin:14px 0 6px;font-size:14px;color:var(--accent2);border-bottom:1px solid var(--line);padding-bottom:5px}
.manual h3:first-child{margin-top:0}
.manual p{margin:5px 0;color:var(--muted);font-size:13px}
.manual li{color:var(--muted);font-size:13px;margin:3px 0}
.manual b{color:var(--text)}
.manual code{background:var(--term-bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:Consolas,monospace;font-size:12px;color:var(--nm)}
.manual kbd{border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px;background:var(--panel2)}

/* ── 主题：浅色 ── */
:root[data-theme="light"]{
  --bg:#eef1f6;--panel:#ffffff;--panel2:#f4f6fa;--line:#e2e8f0;--line2:#cbd5e1;
  --text:#17202c;--muted:#5b6b7e;--faint:#8e9ca9;
  --accent:#2563eb;--accent2:#1d4ed8;
  --green:#16a34a;--amber:#b45309;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;
  --scrollbar:#c3ccd8;--input-bg:#fff;--btn-bg:#fff;--btn-hover-text:var(--text);
  --sess-hover:#eef2f8;--sess-sel:#e7eef9;--dot-off:#b9c4d1;
  --menu-shadow:rgba(15,23,42,.16);--menu-hover:#edf1f7;--meter:#e2e8f0;
  --term-bg:#f7f9fc;--term-text:#3b4859;--step-line:#e8edf3;
  --jv-bg:#f7f9fc;--jv-text:#3b4859;--jv-border:#dfe6ee;--jv-ind:#d5dde7;
  --ky:#7c3aed;--st:#15803d;--nm:#1d4ed8;--bl:#b45309;--nl:#8e9ca9;
  --msg-user-bg:#dbeafe;--msg-user-border:#bfdbfe;--big:#c3ccd8;
  --danger-bg:#fef2f2;--danger-border:#f3c1bd;--danger-text:#b91c1c;--danger-hover-text:#7f1d1d;
  --mask-bg:rgba(30,41,59,.32);--dlg-shadow:rgba(15,23,42,.25);
}
/* ── 主题：Nord（极地蓝灰） ── */
:root[data-theme="nord"]{
  --bg:#2e3440;--panel:#3b4252;--panel2:#434c5e;--line:#4c566a;--line2:#5e6b82;
  --text:#eceff4;--muted:#a5b0c0;--faint:#7b8798;
  --accent:#88c0d0;--accent2:#81a1c1;
  --green:#a3be8c;--amber:#ebcb8b;--red:#bf616a;--blue:#81a1c1;--purple:#b48ead;
  --scrollbar:#4c566a;--input-bg:#2a303d;--btn-bg:#434c5e;--btn-hover-text:#fff;
  --sess-hover:#424a5a;--sess-sel:#48536a;--dot-off:#59657a;
  --menu-shadow:rgba(0,0,0,.5);--menu-hover:#4c566a;--meter:#2a303d;
  --term-bg:#262b36;--term-text:#d8dee9;--step-line:#3f4756;
  --jv-bg:#262b36;--jv-text:#d8dee9;--jv-border:#4c566a;--jv-ind:#4c566a;
  --ky:#b48ead;--st:#a3be8c;--nm:#81a1c1;--bl:#ebcb8b;--nl:#7b8798;
  --msg-user-bg:#3b4a63;--msg-user-border:#4c5b77;--big:#4c566a;
  --danger-bg:#402e32;--danger-border:#6b3a40;--danger-text:#e38a92;--danger-hover-text:#f0aab0;
  --mask-bg:rgba(24,28,36,.66);--dlg-shadow:rgba(0,0,0,.6);
}
/* ── 主题：护眼（Solarized 米白） ── */
:root[data-theme="solarized"]{
  --bg:#fdf6e3;--panel:#fffdf5;--panel2:#f5efdd;--line:#e4dcc4;--line2:#d5cdb4;
  --text:#586e75;--muted:#657b83;--faint:#93a1a1;
  --accent:#268bd2;--accent2:#2176b8;
  --green:#859900;--amber:#b58900;--red:#dc322f;--blue:#268bd2;--purple:#6c71c4;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jv(v,key){
 if(v===null||v===undefined)return '<span class="nl">null</span>';
 if(typeof v==='boolean')return '<span class="bl">'+v+'</span>';
 if(typeof v==='number')return '<span class="nm">'+v+'</span>';

  return '{<div class="ind">'+ks.map(k=>'<div><span class="ky">'+esc(k)+'</span>: '+jv(v[k],k)+'</div>').join('')+'</div><span class="nl">}</span>'}
 return esc(String(v))}

/* ── 时间线：增量渲染，不重建已有 DOM，展开状态不丢失 ── */
function renderSteps(steps){
 let box=document.getElementById('steps');
 document.getElementById('stepCount').textContent=steps.length?steps.length+' 条':'';
 if(steps.length<renderedSteps){box.innerHTML='';renderedSteps=0}
 steps.slice(renderedSteps).forEach(s=>{
  let cls=s.status==='ok'?'ok':(s.status==='error'||s.status==='invalid_action'?'error':'info');
  let e=document.createElement('div');e.className='step '+cls;
  let tm=s._time?new Date(s._time*1000).toLocaleTimeString('zh-CN',{hour12:false}):'';
  e.innerHTML=`<div class="head"><b>步骤 ${s.step??'-'} · ${esc(s.tool||s.status||'event')}</b><span class="schip">${esc(s.status||'')}</span>${tm?`<span class="schip" style="border-style:dashed">${tm}</span>`:''}</div><div class="why">${esc(s.reason||s.error||'')}</div>${s.result?`<details><summary>查看结果</summary><div class="jsonview">${jv(s.result)}</div></details>`:''}`;
  box.prepend(e)});
 renderedSteps=steps.length}

function toast(msg,type=''){let box=document.getElementById('toasts'),e=document.createElement('div');

let _gmResolve=null;
function gmShow(o){if(_gmResolve){const prev=_gmResolve;_gmResolve=null;prev(null)}  // 重入时先了结上一个，防 Promise 悬挂
 return new Promise(res=>{
 _gmResolve=res;
 document.getElementById('gmTitle').textContent=o.title||'提示';
 let m=document.getElementById('gmMsg');m.textContent=o.msg||'';m.style.display=o.msg?'':'none';
 let inp=document.getElementById('gmInput');
 if(o.input!==undefined&&o.input!==null){inp.style.display='';inp.value=o.input}else{inp.style.display='none'}
 let c=document.getElementById('gmCancel');c.style.display=o.cancelText===null?'none':'';c.textContent=o.cancelText||'取消';
 let ok=document.getElementById('gmOk');ok.textContent=o.okText||'确定';ok.className='btn '+(o.danger?'danger':'accent');
 document.getElementById('gmMask').classList.add('open');
 if(inp.style.display!=='none')setTimeout(()=>{inp.focus();inp.select()},60)})}
function gmClose(v){document.getElementById('gmMask').classList.remove('open');if(_gmResolve){_gmResolve(v);_gmResolve=null}}
document.getElementById('gmOk').onclick=()=>{let inp=document.getElementById('gmInput');gmClose(inp.style.display==='none'?true:inp.value)};
document.getElementById('gmCancel').onclick=()=>gmClose(null);

async function load(id){
 current=id;let d=await api('/v1/agent/sessions/'+encodeURIComponent(id)),s=d.session;

/* 轮询在飞保护 + 会话切换竞态防护：
   延迟>1s 时不再堆叠请求；await 返回时若已切到别的会话，丢弃迟到数据 */
let runtimeInflight=false;
async function runtime(){
 if(!current||runtimeInflight)return;
 runtimeInflight=true;
 const myId=current;
 try{let r=await api(`/v1/agent/sessions/${encodeURIComponent(myId)}/runtime`);
  if(current!==myId)return;  // 等待期间用户已切换会话
  currentUrl=r.current_url||currentUrl;
  document.getElementById('pulse').className=r.busy?'pulse':'dot-off';
  document.getElementById('activity').textContent=`阶段: ${r.phase||r.session_state}\n${r.detail||''}\n总步骤: ${r.total_steps}\n当前会话步骤: ${r.conversation_steps}\nToken估算: ${r.estimated_tokens}\n会话序号: ${(r.conversation_index??0)+1}\n最后更新: ${r.updated?new Date(r.updated*1000).toLocaleTimeString():''}`;
  let _ans=r.answer_preview||'等待 Copilot 回答…',_ae=document.getElementById('answer'),_pj=null;
  try{_pj=JSON.parse(_ans)}catch(e){}
  if(_pj&&typeof _pj==='object'){_ae.innerHTML='<div class="jsonview">'+jv(_pj)+'</div>'}else{_ae.textContent=_ans}
  if(_ans!==lastAns){lastAns=_ans;if(liveTabName!=='answer')document.getElementById('tabAnswer').classList.add('new')}
  document.getElementById('prompt').textContent=r.prompt_preview||'';
  setPill(r.session_state);setKpis(r);
  if(r.total_steps!==lastStepCount||(r.detail||'')!==lastDetail){
   lastDetail=r.detail||'';
   let d=await api('/v1/agent/sessions/'+encodeURIComponent(myId));
   if(current!==myId)return;
   renderSteps(d.steps);lastStepCount=d.steps.length}
 }catch(e){}
 finally{runtimeInflight=false}}

<li><b>服务重启后短暂停在登录页</b>：企业 SSO 会经过公司 ADFS 自动回跳，约需 40 秒，一般无需手动登录；若停在账户选择页，手动点一下即可。</li>
<li><b>提示找不到输入框/模型按钮</b>：登录态失效，运行 <code>python login.py</code> 重新登录（或在有窗口模式下直接登录）。</li>
<li><b>任务显示等待服务</b>：Copilot 在限流，等它自动恢复；持续不可用会安全暂停，恢复后点「恢复」。</li>
</ul>`;

/* ── 实时面板选项卡 + 放大查看 ── */
const LIVE_NAMES={activity:'当前执行状态',answer:'Copilot 当前回答',prompt:'最近发送给 Copilot 的内容'};
const LIVE_TAB={activity:'tabActivity',answer:'tabAnswer',prompt:'tabPrompt'};
let liveTabName='activity';
let lastAns='';
function liveTab(n){liveTabName=n;
 for(const k in LIVE_NAMES){document.getElementById(k).style.display=k===n?'':'none';
  document.getElementById(LIVE_TAB[k]).className='tab'+(k===n?' on':'')}}  // className 覆盖即清除新内容圆点
function expandLive(){
 document.getElementById('liveTitle').textContent=LIVE_NAMES[liveTabName];
 document.getElementById('liveBody').innerHTML=document.getElementById(liveTabName).innerHTML;
 document.getElementById('liveMask').classList.add('open')}
function closeLive(){document.getElementById('liveMask').classList.remove('open')}
document.getElementById('liveCopy').onclick=()=>{try{navigator.clipboard.writeText(document.getElementById('liveBody').textContent||'')}catch(e){}};
async function continueAgent(){
 if(!current){toast('请先选择 Session','err');return}
 let instruction=await dlgPrompt('请输入要继续执行的任务','继续执行当前任务，从未完成事项开始','继续执行');
 if(!instruction)return;
 document.getElementById('followup').value=instruction;
 setFollowupMode('agent');
 await sendFollowup()}
async function sendFollowup(){
 if(!current){toast('请先选择 Session','err');return}
 let box=document.getElementById('followup'),content=box.value.trim();
 if(!content)return;
 let btn=document.getElementById('sendFollowup');btn.disabled=true;btn.textContent='发送中';
 let log=document.getElementById('chatlog'),mine=document.createElement('div');
 mine.className='msg user';mine.innerHTML=`<b>你</b>${esc(content)}`;
 log.appendChild(mine);log.scrollTop=log.scrollHeight;box.value='';
 try{let d=await api(`/v1/agent/sessions/${encodeURIComponent(current)}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,model:currentModel||document.getElementById('model').value,agent_mode:followupMode==='agent'})});
  let reply=document.createElement('div');reply.className='msg assistant';
  reply.innerHTML=`<b>Copilot</b>${esc(d.content)}`;
  log.appendChild(reply);log.scrollTop=log.scrollHeight;
  currentUrl=d.url||currentUrl;await load(current)}
 catch(e){let er=document.createElement('div');er.className='msg assistant';er.textContent='发送失败: '+e;log.appendChild(er)}
 finally{btn.disabled=false;btn.textContent='发送'}}
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='followup'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendFollowup()}});
/* ── 新任务模式：Agent 执行 / 普通对话 ── */
let taskMode='agent';
function setTaskMode(m){taskMode=m;
 document.getElementById('ntAgent').className='btn seg'+(m==='agent'?' on':'');
 document.getElementById('ntChat').className='btn seg'+(m==='chat'?' on':'')}

async function runTask(){
 let task=document.getElementById('task').value.trim();if(!task)return;
 let b={model:document.getElementById('model').value,messages:[{role:'user',content:task}],stream:false,session_id:document.getElementById('sid').value.trim()||('task-'+Date.now().toString(36)),workspace:document.getElementById('workspace').value.trim()||null,reuse_session:true,agent_mode:taskMode==='agent'};
 current=b.session_id;
 document.getElementById('emptyState').style.display='none';
 document.getElementById('sessionView').style.display='';
 resetView();
 document.getElementById('activity').textContent=(taskMode==='agent'?'正在建立 Agent 任务 ':'正在发送普通对话 ')+current+'...';
 if(DEMO){await refreshSessions();return}
 fetch('/v1/agent/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})
  .then(async r=>{let t=await r.text(),d=null;try{d=JSON.parse(t)}catch(e){}
   if(!r.ok||!d)throw Error(d&&d.detail?JSON.stringify(d.detail):t.slice(0,300)||('HTTP '+r.status));
   current=d.session_id;await load(current)})
  .catch(e=>{current=null;document.getElementById('sessionView').style.display='none';
   document.getElementById('emptyState').style.display='flex';toast('任务启动失败: '+e,'err')});
 setTimeout(refreshSessions,700)}

function toggleMore(e){e.stopPropagation();document.getElementById('moreMenu').classList.toggle('open')}
document.addEventListener('click',e=>{let m=document.getElementById('moreMenu');if(m&&m.classList.contains('open')&&!e.target.closest('#moreBtn'))m.classList.remove('open')});

const THEMES=[["","深色"],["light","浅色"],["nord","Nord 蓝"],["solarized","护眼米"],["dracula","Dracula 紫"],["roufen","柔粉"],["mint","薄荷"]];
function toggleTheme(){
 let cur=document.documentElement.dataset.theme||'';
 let i=THEMES.findIndex(x=>x[0]===cur);if(i<0)i=0;
 let n=THEMES[(i+1)%THEMES.length];
 if(n[0]){document.documentElement.dataset.theme=n[0]}else{document.documentElement.removeAttribute('data-theme')}
 try{localStorage.setItem('cbp-theme',n[0]||'dark')}catch(e){}
 document.getElementById('themeBtn').title='主题：'+n[1]+'（点击切换）'}
/* ── 左侧栏折叠（归零只剩边缘拉手） ── */
function toggleRail(){let r=document.documentElement,c=r.dataset.rail==='closed';
 if(c){delete r.dataset.rail}else{r.dataset.rail='closed'}
 document.getElementById('railBtn').textContent=c?'‹':'›';
 try{localStorage.setItem('cbp-rail',c?'':'closed')}catch(e){}}
function railNewTask(){if(document.documentElement.dataset.rail==='closed')toggleRail();
 let d=document.querySelector('.newtask');if(d)d.open=true;
 let t=document.getElementById('task');if(t)t.focus()}
try{if(document.documentElement.dataset.rail==="closed")document.getElementById("railBtn").textContent="›"}catch(e){}
try{let cur=document.documentElement.dataset.theme||'',i=THEMES.findIndex(x=>x[0]===cur);document.getElementById('themeBtn').title='主题：'+THEMES[i<0?0:i][1]+'（点击切换）'}catch(e){}
/* ── 启动：API 不可达时进入演示模式（仅用于界面预览） ── */
(async()=>{try{let r=await fetch('/v1/agent/sessions');if(!r.ok){document.getElementById('demoBadge').textContent='API 异常 '+r.status;document.getElementById('demoBadge').style.display='block';return}}catch(e){DEMO=true;document.getElementById('demoBadge').style.display='block'}
 loadModels();browserState();
 refreshSessions().then(()=>{if(DEMO&&sessCache.length&&!current)load(sessCache[0].id)});
 setInterval(()=>{refreshSessions();runtime()},1000)})();
</script></body></html>
