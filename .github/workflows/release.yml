name: Trusted Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, attest, and publish
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install locked dependencies and release tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pip-audit pip-licenses cyclonedx-bom

      - name: Compile Python sources
        shell: pwsh
        run: |
          @'
          import py_compile
          from pathlib import Path

          entries = [Path("app.py"), Path("start.py"), Path("install.py")]
          roots = [Path("gantry"), Path("scripts"), Path("tests")]
          missing = [str(p) for p in entries if not p.is_file()]
          missing += [str(p) for p in roots if not p.is_dir()]
          if missing:
              raise SystemExit("Missing required paths: " + ", ".join(missing))
          files = entries[:]
          for root in roots:
              files.extend(sorted(root.rglob("*.py")))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files.")
          '@ | python -

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check dependencies and vulnerabilities
        shell: pwsh
        run: |
          python -m pip check
          python -m pip_audit -r requirements-lock.txt

      - name: Stage release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = "dist/CopilotBridge_Agent-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $required = @("app.py", "start.py", "install.py", "gantry", "webui", "scripts", "docs", "requirements.txt", "requirements-lock.txt", "config.example.json", "README.md")
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) { throw "Missing required release path: $item" }
            Copy-Item -LiteralPath $item -Destination $stage -Recurse -Force
          }
          foreach ($item in @("CHANGELOG.md", "LICENSE")) {
            if (Test-Path -LiteralPath $item) { Copy-Item -LiteralPath $item -Destination $stage -Force }
          }
          pip-licenses --format=plain --output-file="$stage/licenses.txt"
          cyclonedx-py environment --output-format JSON --output-file "$stage/sbom.cdx.json"

      - name: Create archive and checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "dist/CopilotBridge_Agent-$env:VERSION-windows.zip"
          Compress-Archive -Path "dist/CopilotBridge_Agent-$env:VERSION/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - name: Verify release outputs
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = @(
            "dist/CopilotBridge_Agent-$env:VERSION-windows.zip",
            "dist/SHA256SUMS.txt",
            "dist/CopilotBridge_Agent-$env:VERSION/licenses.txt",
            "dist/CopilotBridge_Agent-$env:VERSION/sbom.cdx.json"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release output: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty release output: $file" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopilotBridge-Agent-${{ steps.version.outputs.version }}
          path: |
            dist/CopilotBridge_Agent-${{ steps.version.outputs.version }}-windows.zip
            dist/SHA256SUMS.txt
            dist/CopilotBridge_Agent-${{ steps.version.outputs.version }}/licenses.txt
            dist/CopilotBridge_Agent-${{ steps.version.outputs.version }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/CopilotBridge_Agent-${{ steps.version.outputs.version }}-windows.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$env:VERSION" `
            "dist/CopilotBridge_Agent-$env:VERSION-windows.zip" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --title "CopilotBridge Agent $env:VERSION"
